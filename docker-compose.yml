services:
  postgres:
    image: postgres:16-alpine
    container_name: job_pipeline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobseeker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobseeker_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-job_pipeline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobseeker} -d ${POSTGRES_DB:-job_pipeline}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
