# GitHub issues extractor configuration
# =============================================================================
# TODO: Verify the exact platform label names, platform bot names, and search
# qualifiers below against GitHub's official docs and your own repo data.
# =============================================================================

version: 1

# --- Two discovery sources ----------------------------------------------------
# SEARCH: property-based queries run on a schedule against GitHub Search API.
# WATCHLIST: repos that passed health check, polled directly (ETag-cached).
search:
  # Queries tagged with a source name. Property-based, not keyword-based.
  queries:
    - source: search_paid
      q: is:issue is:open archived:false
      label_filter:  # applied client-side to results
        - drips-wave
        - bounty
        - bounties
      language:
        - Python
        - JavaScript
        - TypeScript
      updated_within_days: 7
      max_comments: 20
      per_page: 50

    - source: search_proof
      q: is:issue is:open archived:false no:assignee
      label_filter:
        - "good first issue"
        - "help wanted"
        - easy
        - small
      language:
        - Python
        - JavaScript
        - TypeScript
        - Go
        - Rust
      updated_within_days: 7
      max_comments: 20
      per_page: 50

watchlist:
  # Seed repos I provide. Added when search finds good issues there.
  seeds:
    - TripSit/TripBot

# --- Funding evidence (PAID lane only) ----------------------------------------
# At least one platform signal (link or label) AND a parseable amount with currency.
# A title-only amount is NOT enough. The word "bounty" alone is NOT evidence.
funding:
  platforms:
    - algora.io
    - issuehunt.io
    - polar.sh
    - bountysource.com
    - gitcoin.co
    - drips-wave.com   # TODO: verify exact domain/label
  platform_labels:
    - drips-wave       # TODO: verify exact label name
    - bounty
    - bounties
    - reward
    - paid
    - funded
  platform_bots:
    - algora
    - issuehunt
    - polar-bot
    - bountysource
    - gitcoin
    - drips-wave-bot   # TODO: verify
  min_amount_usd: 50.0
  max_amount_usd: 1000000.0

# --- Hard reject reasons (enum) -----------------------------------------------
reject_reasons:
  - CLOSED
  - SELF_ASSIGNED
  - SELF_FIXED
  - OWNER_BACKLOG
  - INTERNAL_TEAM_TASK
  - FOLLOW_UP_INTERNAL
  - NEW_ISSUE_HOLD
  - LOCAL_KNOWLEDGE_REQUIRED
  - DOMAIN_PENALTY
  - WORD_ONLY_MATCH
  - AGGREGATOR_DIGEST
  - TAKEN
  - CRYPTO_WALLET_IN_BODY
  - CRYPTO_PAYMENT
  - BOT_OR_FARM_REPO
  - CLONE_FARM
  - REPEATED_TITLE
  - NO_TASK
  - UNFUNDED_NOTICE
  - PLATFORM_FEATURE
  - TRIVIAL_TASK
  - TEMPLATED_ISSUE
  - LABEL_STUFFING
  - STALE
  - CLOSED_OR_ARCHIVED_REPO
  - UNVERIFIED

# --- Closed/owner/team gate (ordered pipeline) --------------------------------
# Order is enforced in src/opportunities/bounty_verdict.py:FILTER_STAGES and
# tested by tests/test_github_quality_gate.py::test_filter_order.
gate:
  min_contributors: 3                 # OWNER_BACKLOG: fewer distinct contributors = solo-looking
  outside_merge_window_days: 90       # OWNER_BACKLOG: look for outside merged PRs in this window
  new_issue_hold_minutes: 60          # NEW_ISSUE_HOLD: younger than this is held
  new_issue_hold_release_hours: 24    # held until the issue reaches this age
  self_fixed_link_window_minutes: 30  # issue->linked PR within this window = SELF_FIXED
  owner_issue_share_threshold: 0.90   # owner authors >= this share of issues = backlog signal
  reverify_cache_seconds: 300         # fresh re-check cache TTL (5 min, per Step 2)
  # Labels a maintainer applies to invite outside contributors.
  newcomer_labels:
    - "help wanted"
    - "good first issue"
    - "up-for-grabs"
    - "up for grabs"
  internal_labels:
    - plan
    - internal
    - roadmap
    - tracking
    - epic
    - meta
  plan_title_prefixes:
    - "[plan]"
    - "plan:"
    - "todo"
    - "issue 1.5:"
  internal_team_phrases:
    - "teammates"
    - "team mates"
    - "split by category"
    - "see docs/conventions.md before starting"
    - "our team"
    - "sprint"
    - "internal team"
    - "assigned to the team"
  follow_up_patterns:
    - "follow-up from the review of"
    - "follow up from the review of"
    - "from the review of pr #"
    - "from the review of #"
    - "follow-up of the review"
  local_knowledge_patterns:
    - campus
    - college
    - university
    - curriculum
    - "institution's documents"
    - "official documents"
    - syllabus
    - "school's"
    - "district's"

# --- Aggregator / farm repo and title patterns --------------------------------
# TODO(verify): confirm these match the repos you actually see in the feed.
aggregator_repo_patterns:
  - "-watch"
  - "-scout"
  - "bounty-scout"
  - "bounty-watch"
  - "digest"

aggregator_title_patterns:
  - "scope digest"
  - "bounty scout —"      # em dash, as used by bounty-scout
  - "bounty scout -"      # plain hyphen fallback
  - "bounty alert"
  - "intake (release-watch)"

# --- Domain penalties (score penalty, not a hard reject) ----------------------
# TODO(tune): add/remove domains you do not want to work in.
domain_patterns:
  - kernel
  - kernel code
  - operating system
  - hypervisor
  - firmware
  - assembly
  - asm
  - smart contract
  - solidity
  - cryptography

# --- Platform patterns --------------------------------------------------------
farm_repo_patterns:
  - bounty-bot
  - bountybot
  - bounty-plaza
  - bountyplaza
  - bountyscout
  - bounty-scout
  - scout
  - aggregator

bot_author_patterns:
  - github-actions[bot]
  - dependabot[bot]
  - renovate[bot]
  - actions-user

digest_title_patterns:
  - "bounty alert"
  - "new opportunities"
  - "scan results"
  - "bounty digest"
  - "opportunity scan"
  - "intake"
  - "release-watch"
  - "bounty-alert"

unfunded_phrases:
  - "does not fund a bounty"
  - "not funded yet"
  - "no reward"
  - "unpaid"
  - "this issue does not fund"
  - "publishing this issue does not fund"

platform_feature_keywords:
  - "bounty platform"
  - "bounty website"
  - "bounty app"
  - "escrow app"
  - "reward platform"

# --- Crypto payments (ILLEGAL in Nepal: hard reject) ---------------------------
# A bounty paid in crypto must never surface: receiving crypto is unlawful here.
# This is a legal eligibility gate, not a quality signal.
crypto:
  payment_tokens:
    - btc
    - bitcoin
    - eth
    - ethereum
    - ltc
    - litecoin
    - sol
    - solana
    - xlm
    - stellar
    - usdc
    - usdt
    - dai
    - usd coin
    - stablecoin
    - lightning network
    - lightning
    - sats
    - satoshi
    - satoshis
    - on-chain
    - onchain
    - web3
    - defi
    - crypto
    - cryptocurrency
    - memecoin

# --- Stack / domain filters ---------------------------------------------------
stack:
  strong:
    - Python
    - Django
    - DRF
    - Celery
    - Node/Express
    - TypeScript
    - React/Next.js
    - GitHub Actions
    - Docker
  weak:
    - Rust
    - Java

avoid_domains:
  - smart contracts
  - cryptography
  - game engines
  - kernel code

# --- Thresholds ---------------------------------------------------------------
thresholds:
  max_age_days: 14
  min_body_length: 80
  min_task_sentences: 1
  clone_farm_min_repos: 3
  clone_farm_days_window: 30
  clone_farm_author_max_issues: 3
  low_star_threshold: 5
  blocklist_ttl_hours: 24
  repo_health_cache_ttl_days: 7
  repo_pushed_within_days: 30
  label_stuffing_threshold: 6
  repo_size_warn_kb: 50000   # TODO: verify what counts as "very large codebase"
  min_repo_size_kb: 50       # TODO: tune; below this a repo has almost no real code
  # API budget guards: one search run must never exhaust the 5000/hr core quota.
  max_watchlist_repos: 8     # health-check at most this many watchlist repos per run
  max_repo_meta_fetches: 25  # at most this many repo metadata fetches per run
  api_quota_reserve: 400     # stop health checks when fewer than this many calls remain
  confidence_accept: 70
  confidence_reject: 40

# --- Crypto wallet regex ------------------------------------------------------
crypto_address_re: '\b([13][a-km-zA-HJ-NP-Z1-9]{25,34}|bc1[a-z0-9]{39,59}|0x[a-fA-F0-9]{40}|L[a-km-zA-HJ-NP-Z1-9]{26,33}|tb1[a-z0-9]{39,59})\b'
