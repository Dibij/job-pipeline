score_questions:
  skills_match:
    weight: 0.35
    instructions: "How well do the skills this job requires match the candidate's skills?"
    criteria:
      - "completely unrelated"
      - "poor match"
      - "partial match"
      - "strong match"
      - "perfect match"
  seniority_fit:
    weight: 0.30
    instructions: "Is the experience level this job requires suitable for a student or fresh graduate with little professional experience?"
    criteria:
      - "not suitable at all, requires high experience"
      - "poor fit"
      - "moderate fit"
      - "good fit"
      - "ideal entry-level or junior role"
  domain_fit:
    weight: 0.20
    instructions: "Is this job in a field the candidate wants: web, full-stack, backend, or AI development?"
    criteria:
      - "completely unrelated domain"
      - "peripheral domain"
      - "acceptable domain"
      - "strong domain match"
      - "exact domain match"
  growth_fit:
    weight: 0.15
    instructions: "Would this job give a junior person room to learn, with duties that are clear and manageable?"
    criteria:
      - "unmanageable or no room to learn"
      - "low growth potential"
      - "moderate learning opportunity"
      - "good mentorship and scope"
      - "exceptional learning environment"

gate_questions:
  is_real_job:
    instructions: "Is this a genuine job posting with clear duties and requirements?"
    bad_answer: false
    reason_code: "NOT_REAL_JOB"
  remote_from_nepal:
    instructions: "Can this job be done fully remotely by someone living in Nepal?"
    bad_answer: false
    reason_code: "NOT_ACCESSIBLE"
  needs_work_authorization:
    instructions: "Does this job require residency or work authorization in a specific country?"
    bad_answer: true
    reason_code: "REGION_LOCKED"
  # NOTE: unpaid_or_commission_only removed.
  # Unpaid/volunteer/commission-only is evaluated deterministically by regex hard filter (_check_unpaid)
  # in src/matching/hard_filter.py to prevent zero-shot false positives on real paid jobs with stipends.
  # NOTE: requires_other_language removed (Task gate-cleanup).
  # Language is detected deterministically by enrichment (detected_language column)
  # and filtered by plain-code hard filters. No Laya question needed.

penalty_questions:
  fixed_overlap_hours:
    instructions: "Does this job require working fixed hours in a US or European timezone?"
    penalty: -15
  needs_multi_years:
    instructions: "Does this job require 3 or more years of professional experience?"
    penalty: -20

choice_questions:
  role_type:
    instructions: "What is the primary job role being advertised by the employer in this listing?"
    criteria:
      web_fullstack: "Full-stack web software developer writing application code"
      frontend: "Frontend software developer writing web UI code"
      backend: "Backend software developer building server APIs and databases"
      ai_ml: "Machine learning engineer building AI/ML models"
      data: "Data scientist or data engineer"
      mobile: "Mobile application developer"
      devops: "DevOps, SRE, or infrastructure engineer"
      admin_ops: "Administrative assistant, customer operations, or support"
      non_tech: "Paralegal, payroll, content editor, account executive, SDR, sales, marketing, finance, FP&A, linguist, copywriter, or other non-technical role"
      other: "Role that does not fit any of the above categories"
    bonus:
      web_fullstack: 5
      backend: 5
      ai_ml: 5
      frontend: 3
      non_tech: 0


confidence_threshold: 0.65

# Gate behavior configuration (Tasks 7.4b, gate-cleanup)
# When gates_warn_only is true, Laya gates NEVER disqualify — they only add
# gate_warnings. Plain-code hard filters remain the only disqualifiers.
# Set to false after calibration (7.8a) is done and gate accuracy is confirmed.
gates_warn_only: true

# When gates_warn_only is false, a gate can only DISQUALIFY if p_bad exceeds
# gate_disqualify_threshold. Below it, the gate adds a warning only.
gate_disqualify_threshold: 0.90

# Gate WARNING threshold: only record a gate_warning string when p_bad >= this value.
# Below this value the raw probability is still stored in question data but NOT
# surfaced as a warning string. Keeps noise out of summaries until calibration.
gate_warn_threshold: 0.85

# Task 7.5: whether to USE the needs_review flag to filter or rank results.
# Keep false so uncalibrated confidence never drops jobs prematurely.
use_confidence_flag: false


